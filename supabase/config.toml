# Configuración mínima del CLI de Supabase. `supabase init` completa el resto con defaults.
project_id = "orc-rendimiento"

[api]
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
enable_signup = false   # las cuentas las crea el admin (invitación)
